workflows:
  ios-simulator-appetize:
    name: Khedma iOS Simulator for Appetize
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS Simulator app
        script: |
          flutter build ios --simulator --debug --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
      - name: Package Appetize upload
        script: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            artifacts/khedma-ios-simulator.zip
    artifacts:
      - artifacts/khedma-ios-simulator.zip
      - build/ios/iphonesimulator/Runner.app

  ios-release:
    name: Khedma iOS Release IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - khedma-production
    triggering:
      events: []
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Apply Codemagic iOS signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          if [ -n "${ADMOB_IOS_APP_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${ADMOB_IOS_APP_ID}" ios/Runner/Info.plist
          fi
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/ios/symbols \
            --dart-define=ADMOB_BANNER_IOS_ID="${ADMOB_BANNER_IOS_ID:-}"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/symbols/**
      - /tmp/xcodebuild_logs/*.log
