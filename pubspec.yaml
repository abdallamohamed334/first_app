name: loqma
description: "Food surplus management platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: 6.2.1
  sqflite: ^2.3.3
  flutter_cache_manager: ^3.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^2.0.0

  # Firebase foundation and messaging
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  firebase_performance: ^0.10.1+10
  firebase_remote_config: ^5.4.7
  firebase_app_check: ^0.3.2+10

  # Network reliability
  connectivity_plus: ^6.1.5

  # Notifications, QR, and secure local data
  mobile_scanner: ^4.0.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4

  # State management and functional errors
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  dartz: ^0.10.1

  # Local state, routing, and backend
  shared_preferences: ^2.5.5
  go_router: ^14.0.1
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.1.0

  # Media, maps, and links
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  universal_html: ^2.2.4
  url_launcher: ^6.2.1

  # Formatting, animation, and models
  intl: ^0.18.0
  lottie: ^3.3.0
  equatable: ^2.0.5
  injectable: ^3.0.0
  cached_network_image: ^3.3.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/loqma_launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#123B2A"
  adaptive_icon_foreground: "assets/images/loqma_launcher_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/icons/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
